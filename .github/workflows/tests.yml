name: undepRcate tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
      - name: Cache the project R library
        uses: actions/cache@v4
        with:
          path: .local-library
          key: undepRcate-${{ runner.os }}-${{ runner.arch }}-r-4.5.3-${{ hashFiles('renv.lock') }}
      - name: Restore locked packages
        shell: cmd
        run: scripts\start.cmd scripts/setup.R
      - name: Run the R test suite
        shell: cmd
        run: scripts\start.cmd tests/testthat.R
